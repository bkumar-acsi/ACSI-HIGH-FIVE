<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACSII TT Tournament 2026 - Live View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Plus Jakarta Sans", sans-serif; }
        .score-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- HEADER -->
        <div class="mb-8">
            <h1 class="text-4xl font-black text-white mb-2">🏓 ACSII TT Tournament 2026</h1>
            <p class="text-slate-400">Live Scoring Dashboard</p>
        </div>

        <!-- LIVE SCORE SECTION -->
        <div id="live-match-section" class="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl mb-8" style="display: none;">
            <div class="text-center mb-8">
                <div class="text-blue-400 font-bold text-sm">LIVE MATCH</div>
                <div class="text-slate-500 text-xs" id="match-format-display">Best Of 3 Sets</div>
            </div>

            <div class="grid grid-cols-2 gap-4 text-center mb-8">
                <div>
                    <div id="display-name-1" class="text-2xl font-bold mb-4">Team 1</div>
                    <div id="live-points-1" class="score-glow text-6xl font-black mb-4">0</div>
                    <div class="text-sm text-slate-500 mb-2">Sets Won</div>
                    <div id="live-sets-1" class="text-2xl font-bold text-blue-400">0</div>
                </div>

                <div>
                    <div id="display-name-2" class="text-2xl font-bold mb-4">Team 2</div>
                    <div id="live-points-2" class="score-glow text-6xl font-black mb-4">0</div>
                    <div class="text-sm text-slate-500 mb-2">Sets Won</div>
                    <div id="live-sets-2" class="text-2xl font-bold text-blue-400">0</div>
                </div>
            </div>

            <div id="set-history-log" class="p-4 rounded-xl bg-slate-950 border border-slate-800 text-center text-slate-300">
                No Sets Completed Yet
            </div>
        </div>

        <!-- STANDINGS -->
        <div id="all-standings-container" class="space-y-6">
            <div class="text-center text-slate-400">Loading tournament data...</div>
        </div>

        <!-- STATUS -->
        <div id="status" class="text-center text-slate-500 text-sm mt-8">Connecting to live data...</div>
    </main>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const PUBLIC_GIST_ID = "07976ee644e8d7bd84da31758de0ad74";

        // ============================================
        // STATE
        // ============================================
        let tournamentState = {};
        let liveScore = {};

        // ============================================
        // GITHUB API
        // ============================================
        async function loadFromGitHub() {
            if (!PUBLIC_GIST_ID) {
                console.warn("❌ Gist ID not configured");
                return null;
            }

            try {
                console.log("📥 Loading from Gist...");
                const response = await fetch(`https://api.github.com/gists/${PUBLIC_GIST_ID}`);

                if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);

                const gist = await response.json();
                console.log("📦 Files available:", Object.keys(gist.files));

                // Load metadata
                const metadataContent = gist.files["tournament-metadata.json"]?.content;
                const metadata = metadataContent ? JSON.parse(metadataContent) : null;

                // Load live data
                const liveContent = gist.files["live-data.json"]?.content;
                const liveData = liveContent ? JSON.parse(liveContent) : null;

                return {
                    tournament: metadata?.tournament || {},
                    liveScore: liveData?.liveScore || {}
                };
            } catch (error) {
                console.error("❌ Error loading:", error);
                return null;
            }
        }

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadTournamentData() {
            const data = await loadFromGitHub();
            if (!data) {
                document.getElementById("status").textContent = "❌ Failed to load data";
                return;
            }

            tournamentState = data.tournament;
            liveScore = data.liveScore || {};

            console.log("✅ Data loaded:", Object.keys(tournamentState));
            updateLiveScoreDisplay();
            renderDashboard();
            document.getElementById("status").textContent = "✅ Live";
        }

        // ============================================
        // LIVE SCORE DISPLAY
        // ============================================
        function updateLiveScoreDisplay() {
            if (!liveScore || !liveScore.isActive) {
                document.getElementById("live-match-section").style.display = "none";
                return;
            }

            document.getElementById("live-match-section").style.display = "block";
            document.getElementById("display-name-1").innerText = liveScore.team1Name || "Team 1";
            document.getElementById("display-name-2").innerText = liveScore.team2Name || "Team 2";
            document.getElementById("live-points-1").innerText = liveScore.team1Points || 0;
            document.getElementById("live-points-2").innerText = liveScore.team2Points || 0;
            document.getElementById("live-sets-1").innerText = liveScore.team1Sets || 0;
            document.getElementById("live-sets-2").innerText = liveScore.team2Sets || 0;

            const formatText = `Best Of ${liveScore.matchFormat || 3}`;
            document.getElementById("match-format-display").innerText = formatText;

            const history = liveScore.setHistory && liveScore.setHistory.length > 0
                ? `Sets: ${liveScore.setHistory.join(" | ")}`
                : "No Sets Completed Yet";
            document.getElementById("set-history-log").innerText = history;
        }

        // ============================================
        // STANDINGS DISPLAY
        // ============================================
        function renderDashboard() {
            const container = document.getElementById("all-standings-container");
            if (!container) return;

            if (!tournamentState || Object.keys(tournamentState).length === 0) {
                container.innerHTML = '<div class="text-slate-400 text-center py-8">No tournament data available</div>';
                return;
            }

            container.innerHTML = "";

            Object.entries(tournamentState).forEach(([categoryKey, category]) => {
                if (!category || !category.teams || category.teams.length === 0) return;

                const categoryNames = {
                    mens_singles: "Men's Singles",
                    womens_singles: "Women's Singles",
                    mens_doubles: "Men's Doubles",
                    womens_doubles: "Women's Doubles",
                    mix_doubles: "Mixed Doubles"
                };

                const groupedTeams = {};
                category.teams.forEach(team => {
                    const group = team.group || "No Group";
                    if (!groupedTeams[group]) groupedTeams[group] = [];
                    groupedTeams[group].push(team);
                });

                let html = `
<div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden">
    <div class="p-5 border-b border-slate-800">
        <h2 class="font-bold text-lg">${categoryNames[categoryKey] || categoryKey}</h2>
    </div>
    <div class="p-5 space-y-4">`;

                Object.entries(groupedTeams).forEach(([group, teams]) => {
                    html += `<div>
        <div class="text-sm font-semibold text-blue-400 mb-2">${group}</div>
        <div class="space-y-1">`;
                    
                    teams.forEach(team => {
                        html += `<div class="text-sm text-slate-300 p-2 bg-slate-800 rounded">${team.name}</div>`;
                    });
                    
                    html += `</div></div>`;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        // ============================================
        // AUTO REFRESH
        // ============================================
        setInterval(() => {
            console.log("🔄 Refreshing live data...");
            loadTournamentData();
        }, 5000);

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener("DOMContentLoaded", async () => {
            console.log("🚀 View page loaded");
            await loadTournamentData();
        });
    </script>
</body>
</html>
