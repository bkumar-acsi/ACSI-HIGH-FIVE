<!doctype html>

        <style>
            @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background: #0f172a;
                color: #f8fafc;
            }

            ::-webkit-scrollbar {
                width: 6px;
            }

            ::-webkit-scrollbar-track {
                background: #1e293b;
            }

            ::-webkit-scrollbar-thumb {
                background: #475569;
                border-radius: 999px;
            }

            .score-glow {
                text-shadow:
                    0 0 20px rgba(59, 130, 246, 0.8),
                    0 0 40px rgba(59, 130, 246, 0.4);
            }

            .auto-refresh {
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }
        </style>
    </head>

            // Public Gist ID - anyone can read this without authentication
            const PUBLIC_GIST_ID = "07976ee644e8d7bd84da31758de0ad74";

            async function loadFromGitHub() {
                if (!PUBLIC_GIST_ID || PUBLIC_GIST_ID === "YOUR_PUBLIC_GIST_ID_HERE") {
                    console.log("Public Gist ID not configured");
                    return null;
                }

                try {
                    // Read public gist (no token needed, no authentication required)
                    const response = await fetch(`https://api.github.com/gists/${PUBLIC_GIST_ID}`);

                    if (!response.ok) {
                        throw new Error(`GitHub API error: ${response.status}`);
                    }

                    const gist = await response.json();
                    const content = gist.files["tournament-data.json"].content;
                    const data = JSON.parse(content);
                    
                    console.log("Data loaded from public GitHub Gist");
                    return data;
                } catch (error) {
                    console.error("Error loading from GitHub:", error);
                    return null;
                }
            }

                }, 100);
                
                // Auto-refresh every 5 seconds
                setInterval(() => {

                }, 5000);

            async function loadTournamentData() {
                // Try to load from public GitHub Gist ONLY
                if (PUBLIC_GIST_ID && PUBLIC_GIST_ID !== "YOUR_PUBLIC_GIST_ID_HERE") {
                    const githubData = await loadFromGitHub();
                    if (githubData) {

                        tournamentState = githubData.tournament;
                        liveMatch = githubData.liveMatch;
                        
                        console.log("Tournament data:", tournamentState);
                        console.log("Live match:", liveMatch);
                        
                        renderDashboard();
                        updateLiveScoreDOM();
                        applyLiveMatchVisibility();
                        return;
                    } else {
                        console.error("❌ Failed to load from GitHub Gist - check your Gist ID!");
                        return;
                    }
                } else {
                    console.error("❌ Gist ID not configured!");
                    return;
                }

                const categoryNames = {
                    mens_singles: "Men's Singles",
                    womens_singles: "Women's Singles",
                    mens_doubles: "Men's Doubles",
                    womens_doubles: "Women's Doubles",
                    mix_doubles: "Mixed Doubles"
                };
                document.getElementById("fixtures-title").innerText = categoryNames[category] || category;

                // Refresh fixtures if on that tab
                if (currentTab === "fixtures") {
                    renderFixtures();
                } else {
                    renderDashboard();
                    updateLiveScoreDOM();
                }
            }

            function switchTab(tab) {
                currentTab = tab;

                // Update tab buttons
                document.querySelectorAll(".tab-btn").forEach((btn) => {
                    btn.classList.remove("bg-blue-500", "text-white");
                    btn.classList.add("bg-slate-800", "text-slate-300");
                });

                document.getElementById(`btn-${tab}-tab`).classList.remove("bg-slate-800", "text-slate-300");
                document.getElementById(`btn-${tab}-tab`).classList.add("bg-blue-500", "text-white");

                // Show/hide sections
                document.getElementById("standings-nav").style.display = tab === "standings" ? "" : "none";
                document.getElementById("standings-section").style.display = tab === "standings" ? "" : "none";
                document.getElementById("fixtures-section").style.display = tab === "fixtures" ? "" : "none";

                if (tab === "fixtures") {
                    renderFixtures();
                }
            }

            function renderFixtures() {
                const category = tournamentState[currentCategory];
                const fixtures = FIXTURES_DATA[currentCategory];
                
                if (!category || !fixtures) {
                    console.log("No data for", currentCategory);
                    return;
                }
                
                // Render groups from database
                const groupsContainer = document.getElementById("fixtures-groups");
                groupsContainer.innerHTML = "";
                
                // Get unique groups from teams in database
                const groupedTeams = {};
                category.teams.forEach(team => {
                    const group = team.group || "No Group";
                    if (!groupedTeams[group]) {
                        groupedTeams[group] = [];
                    }
                    groupedTeams[group].push(team.name);
                });
                
                // Render groups from database
                Object.entries(groupedTeams).forEach(([groupName, teamNames]) => {
                    groupsContainer.innerHTML += `
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                            <h4 class="font-bold text-blue-400 mb-3">${groupName}</h4>
                            <ul class="space-y-2 text-sm">
                                ${teamNames.map(name => `<li class="text-slate-300">• ${name}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                });

                // Render matches from fixtures
                const matchesContainer = document.getElementById("fixtures-matches");
                matchesContainer.innerHTML = "";
                
                Object.entries(fixtures.matches).forEach(([roundName, matches]) => {
                    let roundHTML = `<div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                        <h4 class="font-bold text-blue-400 mb-3">${roundName}</h4>
                        <div class="space-y-2">`;
                    
                    matches.forEach(({ number, group, match, bye }) => {
                        const displayText = number ? `${number}. ${match}` : match;
                        let byeText = '';
                        if (bye && bye.trim()) {
                            byeText = `<span class="text-amber-400 text-xs ml-2">Bye: ${bye}</span>`;
                        }
                        roundHTML += `<div class="text-sm text-slate-300 p-2 bg-slate-900 rounded">
                            <div class="flex justify-between items-start">
                                <span>${displayText}</span>
                                <span class="text-slate-500 text-xs">${group || ''}</span>
                            </div>
                            ${byeText ? `<div class="mt-1">${byeText}</div>` : ''}
                        </div>`;
                    });
                    
                    roundHTML += `</div></div>`;
                    matchesContainer.innerHTML += roundHTML;
                });
            }

            /* ---------------------------------- */
            /* SCOREBOARD */
            /* ---------------------------------- */

            function updateLiveScoreDOM() {
                const category = tournamentState[currentCategory];

                const team1 = category.teams.find((t) => t.id === liveMatch.team1Id);
                const team2 = category.teams.find((t) => t.id === liveMatch.team2Id);

                document.getElementById("display-name-1").innerText = team1 ? team1.name : "Player 1";
                document.getElementById("display-name-2").innerText = team2 ? team2.name : "Player 2";

                document.getElementById("live-points-1").innerText = liveMatch.points1;
                document.getElementById("live-points-2").innerText = liveMatch.points2;

                document.getElementById("live-sets-1").innerText = liveMatch.sets1;
                document.getElementById("live-sets-2").innerText = liveMatch.sets2;

                document.getElementById("set-history-log").innerText = liveMatch.setHistory.length
                    ? `Sets: ${liveMatch.setHistory.join(" | ")}`
                    : "No Sets Completed Yet";

                document.getElementById("match-format-display").innerText = 
                    liveMatch.matchFormat === 5 ? "Best Of 5 Sets" : "Best Of 7 Sets";
            }

            /* ---------------------------------- */
            /* STANDINGS */
            /* ---------------------------------- */

            function calculateStats(team) {
                const category = tournamentState[currentCategory];

                let played = 0;
                let wins = 0;
                let losses = 0;
                let points = 0;

                category.matches.forEach((match) => {
                    if (match.team1Id !== team.id && match.team2Id !== team.id) {
                        return;
                    }

                    played++;

                    const winner = match.sets1 > match.sets2 ? match.team1Id : match.team2Id;

                    if (winner === team.id) {
                        wins++;
                        points += 3;
                    } else {
                        losses++;
                        points += 1;
                    }
                });

                return {
                    played,
                    wins,
                    losses,
                    points,
                };
            }

            /* ---------------------------------- */
            /* RENDER */
            /* ---------------------------------- */

            /* ---------------------------------- */
            /* TOGGLE LIVE MATCH */
            /* ---------------------------------- */

            /* View page is read-only, no toggle button needed */
            /* Live match visibility is controlled by admin in index.html */

            function renderDashboard() {
                // Render standings for all categories
                const container = document.getElementById("all-standings-container");
                container.innerHTML = "";

                // Render match history for first category
                const firstCategory = tournamentState[currentCategory] || tournamentState["mens_singles"];
                const history = document.getElementById("match-history-list");
                history.innerHTML = "";

                firstCategory.matches.forEach((match) => {
                    history.innerHTML += `
<div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
<div class="text-xs text-slate-500 mb-2">${match.timestamp}</div>
<div class="font-semibold text-lg">
${match.team1Name} <span class="text-blue-400">${match.sets1}</span> : <span class="text-blue-400">${match.sets2}</span> ${match.team2Name}
</div>
<div class="text-xs text-slate-400 mt-2">${match.setHistory.join(" | ")}</div>
</div>
`;
                });

                // Render all categories standings with groups
                Object.keys(tournamentState).forEach((categoryKey) => {
                    const category = tournamentState[categoryKey];
                    
                    if (!category.teams || category.teams.length === 0) {
                        return;
                    }
                    
                    // Group teams by their group
                    const groupedTeams = {};
                    category.teams.forEach(team => {
                        const group = team.group || "No Group";
                        if (!groupedTeams[group]) {
                            groupedTeams[group] = [];
                        }
                        groupedTeams[group].push(team);
                    });
                    
                    let standings = `
<div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden">
    <div class="p-5 border-b border-slate-800 flex justify-between">
        <div>
            <h2 class="font-bold text-lg">${category.title} Standings</h2>
            <p class="text-slate-500 text-sm">Group-wise rankings</p>
        </div>
        <div class="px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold">
            ${category.matches.length} Matches
        </div>
    </div>
    <div class="p-5 space-y-4">
`;

                    // Render standings for each group
                    Object.keys(groupedTeams).forEach(groupName => {
                        standings += `
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
            <h3 class="font-bold text-blue-400 mb-3 text-sm">${groupName}</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="py-2 px-2 text-center">#</th>
                            <th class="py-2 px-2 text-left">Team / Player</th>
                            <th class="py-2 px-2 text-center">Played</th>
                            <th class="py-2 px-2 text-center">Wins</th>
                            <th class="py-2 px-2 text-center">Losses</th>
                            <th class="py-2 px-2 text-center">Diff</th>
                            <th class="py-2 px-2 text-center">Points</th>
                        </tr>
                    </thead>
                    <tbody>
`;

                        groupedTeams[groupName].forEach((team, index) => {
                            const stats = calculateStats(team);
                            standings += `
                        <tr class="border-b border-slate-700">
                            <td class="py-2 px-2 text-center text-xs">${index + 1}</td>
                            <td class="py-2 px-2 text-slate-300 text-xs">${team.name}</td>
                            <td class="py-2 px-2 text-center text-xs">${stats.played}</td>
                            <td class="py-2 px-2 text-center text-green-400 text-xs">${stats.wins}</td>
                            <td class="py-2 px-2 text-center text-red-400 text-xs">${stats.losses}</td>
                            <td class="py-2 px-2 text-center text-xs">${stats.wins - stats.losses}</td>
                            <td class="py-2 px-2 text-center text-blue-400 text-xs font-bold">${stats.points}</td>
                        </tr>
`;
                        });

                        standings += `
                    </tbody>
                </table>
            </div>
        </div>
`;
                    });

                    standings += `
    </div>
</div>
`;

                    container.innerHTML += standings;
                });
            }
        </script>
    </body>
</html>
