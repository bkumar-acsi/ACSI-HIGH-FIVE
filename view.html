<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>ACSII HiFive TT Tournament 2026 - Live View</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <style>
            @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background: #0f172a;
                color: #f8fafc;
            }

            ::-webkit-scrollbar {
                width: 6px;
            }

            ::-webkit-scrollbar-track {
                background: #1e293b;
            }

            ::-webkit-scrollbar-thumb {
                background: #475569;
                border-radius: 999px;
            }

            .score-glow {
                text-shadow:
                    0 0 20px rgba(59, 130, 246, 0.8),
                    0 0 40px rgba(59, 130, 246, 0.4);
            }

            .auto-refresh {
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }
        </style>
    </head>

    <body class="min-h-screen pb-10">
        <!-- HEADER -->

        <header class="sticky top-0 z-50 backdrop-blur bg-slate-900/80 border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <!-- TT LOGO -->

                    <div
                        class="bg-gradient-to-tr from-blue-500 to-cyan-500 p-3 rounded-2xl shadow-lg shadow-blue-500/20"
                    >
                        <svg width="34" height="34" viewBox="0 0 64 64">
                            <circle cx="26" cy="24" r="16" fill="#2563EB" />
                            <circle cx="26" cy="24" r="12" fill="#60A5FA" />

                            <rect x="22" y="38" width="8" height="18" rx="4" fill="#E2E8F0" />

                            <circle cx="50" cy="14" r="6" fill="#FFFFFF" />

                            <path
                                d="M37 18C41 13 45 12 50 14"
                                stroke="#FFFFFF"
                                stroke-width="2.5"
                                stroke-linecap="round"
                            />

                            <path
                                d="M39 26C45 24 50 26 56 32"
                                stroke="#A5F3FC"
                                stroke-width="2.5"
                                stroke-linecap="round"
                            />
                        </svg>
                    </div>

                    <div>
                        <h1 class="text-lg md:text-2xl font-extrabold">ACSII HiFive TT Tournament 2026</h1>

                        <p
                            class="text-xs md:text-sm bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent font-bold whitespace-nowrap"
                        >
                            Live View - Serve • Smash • Shine
                        </p>
                    </div>
                </div>

                <div class="flex gap-2 items-center flex-col md:flex-row">
                    <span class="text-xs text-slate-400 whitespace-nowrap">
                        Auto-refreshing every 5 seconds
                        <span class="auto-refresh inline-block ml-2">●</span>
                    </span>
                </div>
            </div>
        </header>

        <!-- CATEGORY NAV -->

        <section class="sticky top-20 z-40 bg-slate-900 border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 flex gap-2 py-3 overflow-x-auto">
                <button
                    id="btn-mens_singles"
                    onclick="switchCategory('mens_singles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-blue-500 text-white"
                >
                    Men Singles
                </button>

                <button
                    id="btn-mens_doubles"
                    onclick="switchCategory('mens_doubles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300"
                >
                    Men Doubles
                </button>

                <button
                    id="btn-womens_singles"
                    onclick="switchCategory('womens_singles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300"
                >
                    Women Singles
                </button>

                <button
                    id="btn-womens_doubles"
                    onclick="switchCategory('womens_doubles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300"
                >
                    Women Doubles
                </button>

                <button
                    id="btn-mix_doubles"
                    onclick="switchCategory('mix_doubles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300"
                >
                    Mixed Doubles
                </button>
            </div>
        </section>

        <!-- MAIN -->

        <main class="max-w-7xl mx-auto px-4 mt-6">
            <!-- LIVE SCOREBOARD -->

            <div id="live-match-section" class="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl mb-6">
                <div class="text-center mb-8">
                    <div class="text-blue-400 font-bold text-sm">LIVE MATCH</div>
                    <div class="text-slate-500 text-xs" id="match-format-display">Best Of 5 Sets</div>
                </div>

                <!-- SCOREBOARD -->

                <div class="grid grid-cols-2 gap-4 text-center relative">
                    <div>
                        <div id="display-name-1" class="text-2xl font-bold mb-4">Player 1</div>

                        <div id="live-points-1" class="score-glow text-[5rem] font-black leading-none">0</div>

                        <div class="mt-2">
                            <div class="text-sm text-slate-500">Sets Won</div>

                            <div id="live-sets-1" class="text-2xl font-bold text-blue-400">0</div>
                        </div>
                    </div>

                    <div>
                        <div id="display-name-2" class="text-2xl font-bold mb-4">Player 2</div>

                        <div id="live-points-2" class="score-glow text-[5rem] font-black leading-none">0</div>

                        <div class="mt-2">
                            <div class="text-sm text-slate-500">Sets Won</div>

                            <div id="live-sets-2" class="text-2xl font-bold text-blue-400">0</div>
                        </div>
                    </div>
                </div>

                <!-- SET HISTORY -->

                <div
                    id="set-history-log"
                    class="mt-8 p-4 rounded-xl bg-slate-950 border border-slate-800 text-center text-lg text-slate-300 min-h-[40px] flex items-center justify-center"
                >
                    No Sets Completed Yet
                </div>
            </div>

            <!-- STANDINGS FOR ALL CATEGORIES -->

            <div id="all-standings-container" class="space-y-6"></div>

            <!-- MATCH HISTORY -->

            <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden mt-6">
                <div class="p-5 border-b border-slate-800">
                    <h2 class="font-bold text-lg">Match History</h2>
                </div>

                <div id="match-history-list" class="p-5 space-y-3 max-h-[500px] overflow-y-auto"></div>
            </div>
        </main>

        <script>
            /* ---------------------------------- */
            /* TOURNAMENT DATA */
            /* ---------------------------------- */

            const SEED_DATA = {
                mens_singles: {
                    title: "Men Singles",
                    teams: [
                        {
                            id: "ms1",
                            name: "Rahul Sharma",
                        },
                        {
                            id: "ms2",
                            name: "Brajesh Kumar",
                        },
                    ],
                    matches: [],
                },

                mens_doubles: {
                    title: "Men Doubles",
                    teams: [],
                    matches: [],
                },

                womens_singles: {
                    title: "Women Singles",
                    teams: [],
                    matches: [],
                },

                womens_doubles: {
                    title: "Women Doubles",
                    teams: [],
                    matches: [],
                },

                mix_doubles: {
                    title: "Mixed Doubles",
                    teams: [],
                    matches: [],
                },
            };

            let currentCategory = "mens_singles";
            let tournamentState = {};

            let liveMatch = {
                team1Id: "",
                team2Id: "",
                points1: 0,
                points2: 0,
                sets1: 0,
                sets2: 0,
                setHistory: [],
                matchFormat: 5,
            };

            /* ---------------------------------- */
            /* GITHUB INTEGRATION - PUBLIC GIST READ */
            /* ---------------------------------- */

            // Public Gist ID - anyone can read this without authentication
            const PUBLIC_GIST_ID = "07976ee644e8d7bd84da31758de0ad74";

            async function loadFromGitHub() {
                if (!PUBLIC_GIST_ID || PUBLIC_GIST_ID === "YOUR_PUBLIC_GIST_ID_HERE") {
                    console.log("Public Gist ID not configured");
                    return null;
                }

                try {
                    // Read public gist (no token needed, no authentication required)
                    const response = await fetch(`https://api.github.com/gists/${PUBLIC_GIST_ID}`);

                    if (!response.ok) {
                        throw new Error(`GitHub API error: ${response.status}`);
                    }

                    const gist = await response.json();
                    const content = gist.files["tournament-data.json"].content;
                    const data = JSON.parse(content);
                    
                    console.log("Data loaded from public GitHub Gist");
                    return data;
                } catch (error) {
                    console.error("Error loading from GitHub:", error);
                    return null;
                }
            }

            /* ---------------------------------- */
            /* PAGE BOOTSTRAP */
            /* ---------------------------------- */

            window.addEventListener("DOMContentLoaded", () => {
                console.log("View page loaded");
                
                // Load data immediately from public Gist
                loadTournamentData();
                
                // Auto-refresh every 5 seconds
                setInterval(() => {
                    loadTournamentData();
                }, 5000);
            });

            async function loadTournamentData() {
                // Try to load from public GitHub Gist ONLY
                if (PUBLIC_GIST_ID && PUBLIC_GIST_ID !== "YOUR_PUBLIC_GIST_ID_HERE") {
                    const githubData = await loadFromGitHub();
                    if (githubData) {
                        console.log("✅ Loading from GitHub Gist");
                        tournamentState = githubData.tournament;
                        liveMatch = githubData.liveMatch;
                        
                        console.log("Tournament data:", tournamentState);
                        console.log("Live match:", liveMatch);
                        
                        renderDashboard();
                        updateLiveScoreDOM();
                        applyLiveMatchVisibility();
                        return;
                    } else {
                        console.error("❌ Failed to load from GitHub Gist - check your Gist ID!");
                        return;
                    }
                } else {
                    console.error("❌ Gist ID not configured!");
                    return;
                }
            }

            /* ---------------------------------- */
            /* STORAGE */
            /* ---------------------------------- */

            /* ---------------------------------- */
            /* SYNC LIVE MATCH VISIBILITY */
            /* ---------------------------------- */

            function applyLiveMatchVisibility() {
                const section = document.getElementById("live-match-section");
                
                console.log("🎬 applyLiveMatchVisibility called");
                console.log("Current liveMatch.hidden:", liveMatch.hidden);
                console.log("Full liveMatch object:", liveMatch);
                
                // Check if live match is hidden from the data
                if (liveMatch.hidden === true) {
                    console.log("🔴 Setting display to NONE (hidden)");
                    section.style.display = "none";
                } else {
                    console.log("🟢 Setting display to BLOCK (visible)");
                    section.style.display = "";
                }
            }

            /* ---------------------------------- */
            /* CATEGORY SWITCHING */
            /* ---------------------------------- */

            function switchCategory(category) {
                currentCategory = category;

                document.querySelectorAll(".category-btn").forEach((btn) => {
                    btn.classList.remove("bg-blue-500", "text-white");
                    btn.classList.add("bg-slate-800", "text-slate-300");
                });

                document.getElementById(`btn-${category}`).classList.remove("bg-slate-800", "text-slate-300");
                document.getElementById(`btn-${category}`).classList.add("bg-blue-500", "text-white");

                renderDashboard();
                updateLiveScoreDOM();
            }

            /* ---------------------------------- */
            /* SCOREBOARD */
            /* ---------------------------------- */

            function updateLiveScoreDOM() {
                const category = tournamentState[currentCategory];

                const team1 = category.teams.find((t) => t.id === liveMatch.team1Id);
                const team2 = category.teams.find((t) => t.id === liveMatch.team2Id);

                document.getElementById("display-name-1").innerText = team1 ? team1.name : "Player 1";
                document.getElementById("display-name-2").innerText = team2 ? team2.name : "Player 2";

                document.getElementById("live-points-1").innerText = liveMatch.points1;
                document.getElementById("live-points-2").innerText = liveMatch.points2;

                document.getElementById("live-sets-1").innerText = liveMatch.sets1;
                document.getElementById("live-sets-2").innerText = liveMatch.sets2;

                document.getElementById("set-history-log").innerText = liveMatch.setHistory.length
                    ? `Sets: ${liveMatch.setHistory.join(" | ")}`
                    : "No Sets Completed Yet";

                document.getElementById("match-format-display").innerText = 
                    liveMatch.matchFormat === 5 ? "Best Of 5 Sets" : "Best Of 7 Sets";
            }

            /* ---------------------------------- */
            /* STANDINGS */
            /* ---------------------------------- */

            function calculateStats(team) {
                const category = tournamentState[currentCategory];

                let played = 0;
                let wins = 0;
                let losses = 0;
                let points = 0;

                category.matches.forEach((match) => {
                    if (match.team1Id !== team.id && match.team2Id !== team.id) {
                        return;
                    }

                    played++;

                    const winner = match.sets1 > match.sets2 ? match.team1Id : match.team2Id;

                    if (winner === team.id) {
                        wins++;
                        points += 3;
                    } else {
                        losses++;
                        points += 1;
                    }
                });

                return {
                    played,
                    wins,
                    losses,
                    points,
                };
            }

            /* ---------------------------------- */
            /* RENDER */
            /* ---------------------------------- */

            /* ---------------------------------- */
            /* TOGGLE LIVE MATCH */
            /* ---------------------------------- */
            /* TOGGLE LIVE MATCH */
            /* ---------------------------------- */

            /* View page is read-only, no toggle button needed */
            /* Live match visibility is controlled by admin in index.html */

            function renderDashboard() {
                // Render standings for all categories
                const container = document.getElementById("all-standings-container");
                container.innerHTML = "";

                // Render match history for first category
                const firstCategory = tournamentState[currentCategory] || tournamentState["mens_singles"];
                const history = document.getElementById("match-history-list");
                history.innerHTML = "";

                firstCategory.matches.forEach((match) => {
                    history.innerHTML += `
<div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
<div class="text-xs text-slate-500 mb-2">${match.timestamp}</div>
<div class="font-semibold text-lg">
${match.team1Name} <span class="text-blue-400">${match.sets1}</span> : <span class="text-blue-400">${match.sets2}</span> ${match.team2Name}
</div>
<div class="text-xs text-slate-400 mt-2">${match.setHistory.join(" | ")}</div>
</div>
`;
                });

                // Render all categories standings
                Object.keys(tournamentState).forEach((categoryKey) => {
                    const category = tournamentState[categoryKey];
                    
                    let standings = `
<div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden">
    <div class="p-5 border-b border-slate-800 flex justify-between">
        <div>
            <h2 class="font-bold text-lg">${category.title} Standings</h2>
            <p class="text-slate-500 text-sm">Rankings update automatically</p>
        </div>
        <div class="px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold">
            ${category.matches.length} Matches
        </div>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="border-b border-slate-800 text-slate-400 text-sm">
                    <th class="py-4 px-4 text-center">#</th>
                    <th class="py-4 px-4">Team / Player</th>
                    <th class="py-4 px-4 text-center">Played</th>
                    <th class="py-4 px-4 text-center">Wins</th>
                    <th class="py-4 px-4 text-center">Losses</th>
                    <th class="py-4 px-4 text-center">Set Diff</th>
                    <th class="py-4 px-4 text-center">Points</th>
                </tr>
            </thead>
            <tbody>
`;

                    category.teams.forEach((team, index) => {
                        const stats = calculateStats(team);
                        standings += `
<tr class="border-b border-slate-800">
    <td class="py-4 px-4 text-center">${index + 1}</td>
                    <td class="py-4 px-4 font-semibold">${team.name}</td>
                    <td class="py-4 px-4 text-center">${stats.played}</td>
                    <td class="py-4 px-4 text-center text-green-400">${stats.wins}</td>
                    <td class="py-4 px-4 text-center text-red-400">${stats.losses}</td>
                    <td class="py-4 px-4 text-center">${stats.wins - stats.losses}</td>
                    <td class="py-4 px-4 text-center text-blue-400 font-bold">${stats.points}</td>
                </tr>
`;
                    });

                    standings += `
            </tbody>
        </table>
    </div>
</div>
`;

                    container.innerHTML += standings;
                });
            }
        </script>
    </body>
</html>
