<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>ACSII HiFive TT Tournament 2026</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <style>
            @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background: #0f172a;
                color: #f8fafc;
            }

            ::-webkit-scrollbar {
                width: 6px;
            }

            ::-webkit-scrollbar-track {
                background: #1e293b;
            }

            ::-webkit-scrollbar-thumb {
                background: #475569;
                border-radius: 999px;
            }

            .score-glow {
                text-shadow:
                    0 0 20px rgba(59, 130, 246, 0.8),
                    0 0 40px rgba(59, 130, 246, 0.4);
            }
        </style>
    </head>

    <body class="min-h-screen pb-10">
        <!-- HEADER -->

        <header class="sticky top-0 z-50 backdrop-blur bg-slate-900/80 border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <!-- TT LOGO -->

                    <div
                        class="bg-gradient-to-tr from-blue-500 to-cyan-500 p-3 rounded-2xl shadow-lg shadow-blue-500/20"
                    >
                        <svg width="34" height="34" viewBox="0 0 64 64">
                            <circle cx="26" cy="24" r="16" fill="#2563EB" />
                            <circle cx="26" cy="24" r="12" fill="#60A5FA" />

                            <rect x="22" y="38" width="8" height="18" rx="4" fill="#E2E8F0" />

                            <circle cx="50" cy="14" r="6" fill="#FFFFFF" />

                            <path
                                d="M37 18C41 13 45 12 50 14"
                                stroke="#FFFFFF"
                                stroke-width="2.5"
                                stroke-linecap="round"
                            />

                            <path
                                d="M39 26C45 24 50 26 56 32"
                                stroke="#A5F3FC"
                                stroke-width="2.5"
                                stroke-linecap="round"
                            />
                        </svg>
                    </div>

                    <div>
                        <h1 class="text-lg md:text-2xl font-extrabold">ACSII HiFive TT Tournament 2026</h1>

                        <p
                            class="text-xs md:text-sm bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent font-bold whitespace-nowrap"
                        >
                            Serve • Smash • Shine
                        </p>
                    </div>
                </div>

                <div class="flex gap-2 flex-col md:flex-row">
                    <button
                        onclick="refreshData()"
                        class="px-4 py-2 rounded-xl bg-green-500/10 border border-green-500/30 hover:bg-green-500/20 text-green-400 text-sm font-semibold transition"
                    >
                        🔄 Refresh Data
                    </button>
                    <button
                        disabled
                        class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm font-semibold opacity-50 cursor-not-allowed"
                    >
                        Reset Tournament
                    </button>
                </div>
            </div>
        </header>

        <!-- CATEGORY NAV -->

        <section class="sticky top-20 z-40 bg-slate-900 border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 flex gap-2 py-3 overflow-x-auto">
                <button
                    id="btn-mens_singles"
                    onclick="switchCategory('mens_singles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-blue-500 text-white"
                >
                    Men Singles
                </button>

                <button
                    id="btn-mens_doubles"
                    onclick="switchCategory('mens_doubles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300"
                >
                    Men Doubles
                </button>

                <button
                    id="btn-womens_singles"
                    onclick="switchCategory('womens_singles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300"
                >
                    Women Singles
                </button>

                <button
                    id="btn-womens_doubles"
                    onclick="switchCategory('womens_doubles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300"
                >
                    Women Doubles
                </button>

                <button
                    id="btn-mix_doubles"
                    onclick="switchCategory('mix_doubles')"
                    class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300"
                >
                    Mixed Doubles
                </button>
            </div>
        </section>

        <!-- MAIN -->

        <main class="max-w-7xl mx-auto px-4 mt-6">
            <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
                <!-- LIVE SCOREBOARD -->

                <div id="live-match-section" class="xl:col-span-2 space-y-6">
                    <div
                        class="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-5 shadow-2xl"
                    >
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <div class="text-blue-400 font-bold text-sm">LIVE MATCH</div>
                            </div>

                            <div class="flex gap-2 items-center">
                                <button
                                    onclick="toggleViewerVisibility()"
                                    id="btn-viewer-visibility"
                                    class="px-3 py-1 rounded-full bg-green-500/10 border border-green-500/30 hover:bg-green-500/20 text-green-400 text-xs font-semibold transition"
                                >
                                    Show to Viewers
                                </button>
                                
                                <select
                                    id="match-format-select"
                                    onchange="setMatchFormat(parseInt(this.value))"
                                    class="px-3 py-1 rounded-full bg-blue-500/20 border border-blue-500/40 text-blue-400 text-xs font-semibold transition hover:bg-blue-500/30 cursor-pointer"
                                >
                                    <option value="3">Best of 3</option>
                                    <option value="5">Best of 5</option>
                                    <option value="7">Best of 7</option>
                                </select>
                            </div>

                            <div
                                class="px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold"
                            >
                                SCORING ACTIVE
                            </div>
                        </div>

                        <!-- PLAYER SELECTION -->

                        <div class="grid grid-cols-2 gap-4 mb-3">
                            <select
                                id="live-team-1"
                                onchange="updateLiveScore()"
                                class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm"
                            ></select>

                            <select
                                id="live-team-2"
                                onchange="updateLiveScore()"
                                class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm"
                            ></select>
                        </div>

                        <!-- SCOREBOARD -->

                        <div class="grid grid-cols-2 gap-4 text-center relative">
                            <div>
                                <div id="display-name-1" class="text-lg font-bold mb-4">Player 1</div>

                                <input
                                    type="number"
                                    id="live-points-1"
                                    min="0"
                                    onchange="updatePointsFromInput(1)"
                                    class="score-glow text-[3rem] font-black leading-none w-full text-center bg-slate-900 border-2 border-slate-700 rounded-xl px-2 py-1 focus:outline-none focus:border-blue-500"
                                    value="0"
                                />

                                <div class="mt-6 flex justify-center gap-3">
                                    <button
                                        onclick="adjustPoints(1,-1)"
                                        class="w-12 h-12 rounded-xl bg-slate-800 text-xl"
                                    >
                                        -
                                    </button>

                                    <button
                                        onclick="adjustPoints(1,1)"
                                        class="w-16 h-12 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 text-slate-950 text-3xl font-black"
                                    >
                                        +
                                    </button>
                                </div>

                                <div class="mt-2">
                                    <div class="text-sm text-slate-500">Sets Won</div>

                                    <div id="live-sets-1" class="text-xl font-bold text-blue-400">0</div>
                                </div>
                            </div>

                            <div>
                                <div id="display-name-2" class="text-lg font-bold mb-4">Player 2</div>

                                <input
                                    type="number"
                                    id="live-points-2"
                                    min="0"
                                    onchange="updatePointsFromInput(2)"
                                    class="score-glow text-[3rem] font-black leading-none w-full text-center bg-slate-900 border-2 border-slate-700 rounded-xl px-2 py-1 focus:outline-none focus:border-blue-500"
                                    value="0"
                                />

                                <div class="mt-6 flex justify-center gap-3">
                                    <button
                                        onclick="adjustPoints(2,-1)"
                                        class="w-12 h-12 rounded-xl bg-slate-800 text-xl"
                                    >
                                        -
                                    </button>

                                    <button
                                        onclick="adjustPoints(2,1)"
                                        class="w-16 h-12 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 text-slate-950 text-3xl font-black"
                                    >
                                        +
                                    </button>
                                </div>

                                <div class="mt-2">
                                    <div class="text-sm text-slate-500">Sets Won</div>

                                    <div id="live-sets-2" class="text-xl font-bold text-blue-400">0</div>
                                </div>
                            </div>
                        </div>
                        <!-- SET HISTORY -->

                        <div
                            id="set-history-log"
                            class="mt-4 p-3 rounded-xl bg-slate-950 border border-slate-800 text-center text-sm text-slate-300 min-h-[32px] flex items-center justify-center"
                        >
                            No Sets Completed Yet
                        </div>

                        <!-- MATCH ACTIONS -->

                        <div class="grid grid-cols-2 gap-3 mt-4">
                            <button
                                onclick="confirmSetWinner()"
                                class="py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold transition"
                            >
                                End Current Set
                            </button>

                            <button
                                onclick="submitCompletedMatch()"
                                class="py-3 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 text-slate-950 font-bold text-sm transition"
                            >
                                Save Match
                            </button>
                        </div>
                    </div>

                    <!-- ADD TEAM PANEL -->

                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <h3 class="text-lg font-bold mb-4">Add Competitor</h3>

                        <form id="add-team-form" onsubmit="createNewTeam(event)" class="flex gap-3">
                            <input
                                id="new-team-name"
                                required
                                type="text"
                                placeholder="Enter player or pair name"
                                class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3"
                            />

                            <button type="submit" class="px-5 py-3 rounded-xl bg-blue-500 text-white font-semibold">
                                Add
                            </button>
                        </form>
                    </div>
                </div>

                <!-- RIGHT SIDE -->

                <div class="xl:col-span-2 space-y-6">
                    <!-- STANDINGS FOR ALL CATEGORIES -->

                    <div id="all-standings-container" class="space-y-6"></div>

                    <!-- MATCH HISTORY -->

                    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden">
                        <div class="p-5 border-b border-slate-800 flex justify-between">
                            <h2 class="font-bold text-lg">Match History</h2>

                            <div id="match-count-badge" class="text-sm text-slate-400">0 Matches</div>
                        </div>

                        <div id="match-history-list" class="p-5 space-y-3 max-h-[420px] overflow-y-auto"></div>
                    </div>

                        <div class="p-5 space-y-8">

                            <div>

                                <div id="admin-fixtures-groups" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
                            </div>

                            <!-- MATCHES -->
                            <div>
                                <h3 class="text-sm font-bold text-blue-400 mb-4">MATCHES</h3>
                                <div id="admin-fixtures-matches" class="space-y-4"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

            async function saveToGitHub(liveScore) {
                if (!githubToken) {
                    console.warn("GitHub token not set, cannot save");
                    return;
                }

                try {
                    // IMPORTANT: Only save LIVE DATA, never modify METADATA
                    const gistData = {
                        description: "ACSII TT Tournament 2026 - Live Scoring Data",
                        public: false,
                        files: {
                            "live-data.json": {
                                content: JSON.stringify({
                                    liveScore: liveScore || {}
                                }, null, 2)
                            }
                        }
                    };

                    let url = "https://api.github.com/gists";
                    let method = "POST";

                    if (gistId) {
                        url = `https://api.github.com/gists/${gistId}`;
                        method = "PATCH";
                    }

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            "Authorization": `token ${githubToken}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(gistData)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`GitHub API error: ${response.status} - ${errorData.message || 'Unknown error'}`);
                    }

                    console.log("✅ Live data saved to GitHub");
                    const result = await response.json();
                    
                    if (!gistId) {
                        gistId = result.id;
                        console.log("⚠️ Add ?gistId=" + gistId + " to your URL for next time");
                    }

                    console.log("Data saved to GitHub Gist:", gistId);
                } catch (error) {
                    console.error("Error saving to GitHub:", error);
                    // Don't alert on every save, just log it
                    // Users can still use the app with local storage
                }
            }

            async function loadFromGitHub() {
                if (!githubToken || !gistId) {
                    console.warn("⚠️ Cannot load - token or gistId missing");
                    return null;
                }

                try {
                    console.log("📥 Loading from GitHub Gist:", gistId);
                    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        headers: {
                            "Authorization": `token ${githubToken}`
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`GitHub API error: ${response.status}`);
                    }

                    const gist = await response.json();
                    
                    // Load metadata
                    const metadataContent = gist.files["tournament-metadata.json"]?.content;
                    const metadata = metadataContent ? JSON.parse(metadataContent) : null;
                    
                    // Load live data
                    const liveContent = gist.files["live-data.json"]?.content;
                    const liveData = liveContent ? JSON.parse(liveContent) : null;
                    
                    console.log("✅ GitHub data loaded successfully");
                    console.log("   Tournament categories:", Object.keys(metadata?.tournament || {}));
                    
                    return {
                        tournament: metadata?.tournament || {},
                        liveMatch: liveData?.liveScore || {}
                    };
                    
                } catch (error) {
                    console.error("❌ Error loading from GitHub:", error);
                    return null;
                }
            }

            function renderAdminFixtures() {
                const category = tournamentState[currentCategory];
                const fixtures = FIXTURES_DATA[currentCategory];
                
                if (!category || !category.teams || !fixtures) {
                    console.log("⚠️ No fixtures for", currentCategory, "- category:", !!category, "teams:", category?.teams?.length);
                    return;
                }
                
                // Update title
                const categoryNames = {
                    mens_singles: "Men's Singles",
                    womens_singles: "Women's Singles",
                    mens_doubles: "Men's Doubles",
                    womens_doubles: "Women's Doubles",
                    mix_doubles: "Mixed Doubles"
                };
                document.getElementById("admin-fixtures-title").innerText = categoryNames[currentCategory] || currentCategory;
                
                // Render groups from database
                const groupsContainer = document.getElementById("admin-fixtures-groups");
                groupsContainer.innerHTML = "";
                
                // Get unique groups from teams in database
                const groupedTeams = {};
                category.teams.forEach(team => {
                    const group = team.group || "No Group";
                    if (!groupedTeams[group]) {
                        groupedTeams[group] = [];
                    }
                    groupedTeams[group].push(team.name);
                });
                
                // Sort groups in order A, B, C, D, All Teams
                const groupOrder = ["Group A", "Group B", "Group C", "Group D", "All Teams"];
                const sortedGroups = Object.keys(groupedTeams).sort((a, b) => {
                    const aIndex = groupOrder.indexOf(a);
                    const bIndex = groupOrder.indexOf(b);
                    if (aIndex === -1) return 1;
                    if (bIndex === -1) return 1;
                    return aIndex - bIndex;
                });
                
                // Render groups in sorted order
                sortedGroups.forEach(groupName => {
                    groupsContainer.innerHTML += `
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                            <h4 class="font-bold text-blue-400 mb-3">${groupName}</h4>
                            <ul class="space-y-2 text-sm">
                                ${groupedTeams[groupName].map(name => `<li class="text-slate-300">• ${name}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                });

                // Render matches from fixtures
                const matchesContainer = document.getElementById("admin-fixtures-matches");
                matchesContainer.innerHTML = "";
                
                Object.entries(fixtures.matches).forEach(([roundName, matches]) => {
                    let roundHTML = `<div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                        <h4 class="font-bold text-blue-400 mb-3">${roundName}</h4>
                        <div class="space-y-2">`;
                    
                    matches.forEach(({ number, group, match, bye }) => {
                        const displayText = number ? `${number}. ${match}` : match;
                        let byeText = '';
                        if (bye && bye.trim()) {
                            byeText = `<span class="text-amber-400 text-xs ml-2">Bye: ${bye}</span>`;
                        }
                        roundHTML += `<div class="text-sm text-slate-300 p-2 bg-slate-900 rounded">
                            <div class="flex justify-between items-start">
                                <span>${displayText}</span>
                                <span class="text-slate-500 text-xs">${group || ''}</span>
                            </div>
                            ${byeText ? `<div class="mt-1">${byeText}</div>` : ''}
                        </div>`;
                    });
                    
                    roundHTML += `</div></div>`;
                    matchesContainer.innerHTML += roundHTML;
                });
            }

                    category.teams.forEach((team) => {
                        select1.innerHTML += `<option value="${team.name}">${team.name}</option>`;
                    });

                    // For select2, we'll filter dynamically based on select1 selection
                    category.teams.forEach((team) => {
                        select2.innerHTML += `<option value="${team.name}" class="team-option">${team.name}</option>`;
                    });

                // Restore previously selected teams from liveScore if they exist

                    select1.value = liveScore.team1Name;

                if (liveScore && liveScore.team2Name) {
                    select2.value = liveScore.team2Name;
                    // Update select2 to exclude selected team1
                    if (liveScore.team1Name) {
                        updateSelect2Options(liveScore.team1Name);
                    }
                }

                // Remove old event listeners by cloning and replacing
                const newSelect1 = select1.cloneNode(true);
                const newSelect2 = select2.cloneNode(true);
                
                select1.parentNode.replaceChild(newSelect1, select1);
                select2.parentNode.replaceChild(newSelect2, select2);

                // Add event listeners to new elements
                document.getElementById("live-team-1").addEventListener("change", () => {
                    const selectedTeam1 = document.getElementById("live-team-1").value;
                    
                    // Update select2 to exclude the selected team from select1
                    updateSelect2Options(selectedTeam1);

                if (select2.value === excludeTeam) {

                    liveMatch.team2Id = "";
                }
            }

                    return;
                }

                const team = category.teams.find((t) => t.id === teamId);

                if (!team) return;

                if (!confirm(`Delete ${team.name}?`)) {
                    return;
                }

                category.matches = category.matches.filter(
                    (match) => match.team1Id !== teamId && match.team2Id !== teamId
                );

                category.teams = category.teams.filter((team) => team.id !== teamId);

                saveTournamentData();

                renderDashboard();

                initLiveSelectors();
            }

            /* ---------------------------------- */
            /* SCOREBOARD */
            /* ---------------------------------- */

            function adjustPoints(team, amount) {
                if (team === 1) {
                    liveMatch.points1 = Math.max(0, liveMatch.points1 + amount);
                } else {
                    liveMatch.points2 = Math.max(0, liveMatch.points2 + amount);
                }

                updateLiveScoreDOM();
                updateLiveScore(); // Save to liveScore table
            }

            function updatePointsFromInput(team) {
                const input = document.getElementById(`live-points-${team}`);
                const value = parseInt(input.value) || 0;

                if (team === 1) {
                    liveMatch.points1 = Math.max(0, value);
                } else {
                    liveMatch.points2 = Math.max(0, value);
                }

                updateLiveScoreDOM();
                updateLiveScore(); // Save to liveScore table
            }

            function updateLiveScoreDOM() {
                // Get values directly from dropdowns (more reliable)
                const select1Value = document.getElementById("live-team-1").value;
                const select2Value = document.getElementById("live-team-2").value;
                
                // Display the selected team names
                document.getElementById("display-name-1").innerText = select1Value || "Player 1";
                document.getElementById("display-name-2").innerText = select2Value || "Player 2";

                document.getElementById("live-points-1").value = liveMatch.points1;
                document.getElementById("live-points-2").value = liveMatch.points2;

                document.getElementById("live-sets-1").innerText = liveMatch.sets1;
                document.getElementById("live-sets-2").innerText = liveMatch.sets2;

                document.getElementById("set-history-log").innerText = liveMatch.setHistory.length
                    ? `Sets: ${liveMatch.setHistory.join(" | ")}`
                    : "No Sets Completed Yet";
            }

            /* ---------------------------------- */
            /* SET LOGGING */
            /* ---------------------------------- */

            function clearHistory() {
                if (!confirm("Clear all set history for this match?")) {
                    return;
                }

                liveMatch.setHistory = [];
                liveMatch.points1 = 0;
                liveMatch.points2 = 0;
                liveMatch.sets1 = 0;
                liveMatch.sets2 = 0;

                updateLiveScoreDOM();
            }

            function confirmSetWinner() {
                if (liveMatch.points1 === 0 && liveMatch.points2 === 0) {
                    return;
                }

                liveMatch.setHistory.push(`${liveMatch.points1}-${liveMatch.points2}`);

                if (liveMatch.points1 > liveMatch.points2) {
                    liveMatch.sets1++;
                } else {
                    liveMatch.sets2++;
                }

                liveMatch.points1 = 0;
                liveMatch.points2 = 0;

                updateLiveScoreDOM();
                localStorage.setItem("acsii_tt_live_match", JSON.stringify(liveMatch));
            }

            /* ---------------------------------- */
            /* SAVE MATCH */
            /* ---------------------------------- */

            function submitCompletedMatch() {
                const category = tournamentState[currentCategory];

                const team1 = category.teams.find((t) => t.id === liveMatch.team1Id);

                const team2 = category.teams.find((t) => t.id === liveMatch.team2Id);

                if (!team1 || !team2) {
                    return;
                }

                if (liveMatch.sets1 === 0 && liveMatch.sets2 === 0) {
                    alert("No completed sets.");

                    return;
                }

                category.matches.unshift({
                    id: "m_" + Date.now(),

                    team1Id: team1.id,

                    team2Id: team2.id,

                    team1Name: team1.name,

                    team2Name: team2.name,

                    sets1: liveMatch.sets1,

                    sets2: liveMatch.sets2,

                    setHistory: [...liveMatch.setHistory],

                    timestamp: new Date().toLocaleString(),
                });

                liveMatch.points1 = 0;
                liveMatch.points2 = 0;

                liveMatch.sets1 = 0;
                liveMatch.sets2 = 0;

                liveMatch.setHistory = [];

                saveTournamentData();

                renderDashboard();

                updateLiveScoreDOM();
            }

            /* ---------------------------------- */
            /* EDIT AND DELETE MATCHES */
            /* ---------------------------------- */

            function editMatch(matchIndex) {
                const category = tournamentState[currentCategory];
                const match = category.matches[matchIndex];

                if (!match) return;

                const sets1 = prompt("Enter sets for team 1:", match.sets1);
                if (sets1 === null) return;

                const sets2 = prompt("Enter sets for team 2:", match.sets2);
                if (sets2 === null) return;

                match.sets1 = parseInt(sets1) || 0;
                match.sets2 = parseInt(sets2) || 0;

                saveTournamentData();
                renderDashboard();
            }

            function deleteMatch(matchIndex) {
                const category = tournamentState[currentCategory];
                
                if (!confirm("Delete this match?")) return;

                category.matches.splice(matchIndex, 1);

                saveTournamentData();
                renderDashboard();
            }

            function calculateStats(team) {
                const category = tournamentState[currentCategory];

                let played = 0;
                let wins = 0;
                let losses = 0;
                let points = 0;

                category.matches.forEach((match) => {
                    if (match.team1Id !== team.id && match.team2Id !== team.id) {
                        return;
                    }

                    played++;

                    const winner = match.sets1 > match.sets2 ? match.team1Id : match.team2Id;

                    if (winner === team.id) {
                        wins++;
                        points += 3;
                    } else {
                        losses++;
                        points += 1;
                    }
                });

                return {
                    played,
                    wins,
                    losses,
                    points,
                };
            }

            /* ---------------------------------- */
            /* RENDER */
            /* ---------------------------------- */

            function renderDashboard() {
                // Show standings for all categories, with currentCategory first
                const container = document.getElementById("all-standings-container");
                if (!container) {
                    console.log("Standings container not found");
                    return;
                }
                
                container.innerHTML = "";

                // Check if tournamentState is loaded
                if (!tournamentState || Object.keys(tournamentState).length === 0) {
                    console.warn("⚠️ Tournament state is empty - no data to display");
                    container.innerHTML = '<div class="text-slate-400 text-center py-8">Loading tournament data...</div>';
                    return;
                }

                // Create sorted array with currentCategory first
                const categoryKeys = Object.keys(tournamentState);
                const sortedKeys = [
                    currentCategory,
                    ...categoryKeys.filter(key => key !== currentCategory)
                ];

                sortedKeys.forEach((categoryKey) => {
                    const category = tournamentState[categoryKey];
                    
                    // Safety check
                    if (!category || !category.teams || category.teams.length === 0) {
                        console.log(`Skipping empty category: ${categoryKey}`);
                        return; // Skip empty categories
                    }
                    
                    // Group teams by their group
                    const groupedTeams = {};
                    category.teams.forEach(team => {
                        const group = team.group || "No Group";
                        if (!groupedTeams[group]) {
                            groupedTeams[group] = [];
                        }
                        groupedTeams[group].push(team);
                    });
                    
                    let standings = `
<div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden">
    <div class="p-5 border-b border-slate-800 flex justify-between">
        <div>
            <h2 class="font-bold text-lg">${category.title}</h2>
            <p class="text-slate-500 text-sm">Rankings update automatically</p>
        </div>
        <div class="px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold">
            ${category.matches ? category.matches.length : 0} Matches
        </div>
    </div>
    <div class="p-5 space-y-4">
`;

                    // Render standings for each group
                    Object.keys(groupedTeams).forEach(groupName => {
                        standings += `
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
            <h3 class="font-bold text-blue-400 mb-3 text-sm">${groupName}</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="py-2 px-2 text-center">#</th>
                            <th class="py-2 px-2 text-left">Team / Player</th>
                            <th class="py-2 px-2 text-center">Played</th>
                            <th class="py-2 px-2 text-center">Wins</th>
                            <th class="py-2 px-2 text-center">Losses</th>
                            <th class="py-2 px-2 text-center">Diff</th>
                            <th class="py-2 px-2 text-center">Points</th>
                        </tr>
                    </thead>
                    <tbody>
`;

                        groupedTeams[groupName].forEach((team, index) => {
                            const stats = calculateStats(team);
                            standings += `
                        <tr class="border-b border-slate-700">
                            <td class="py-2 px-2 text-center text-xs">${index + 1}</td>
                            <td class="py-2 px-2 text-slate-300 text-xs">${team.name}</td>
                            <td class="py-2 px-2 text-center text-xs">${stats.played}</td>
                            <td class="py-2 px-2 text-center text-green-400 text-xs">${stats.wins}</td>
                            <td class="py-2 px-2 text-center text-red-400 text-xs">${stats.losses}</td>
                            <td class="py-2 px-2 text-center text-xs">${stats.wins - stats.losses}</td>
                            <td class="py-2 px-2 text-center text-blue-400 text-xs font-bold">${stats.points}</td>
                        </tr>
`;
                        });

                        standings += `
                    </tbody>
                </table>
            </div>
        </div>
`;
                    });

                    standings += `
    </div>
</div>
`;

                    container.innerHTML += standings;
                });
            }

            function renderMatchHistory() {
                const category = tournamentState[currentCategory];
                const history = document.getElementById("match-history-list");
                history.innerHTML = "";

                category.matches.forEach((match, index) => {
                    history.innerHTML += `
<div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
<div class="flex justify-between items-start mb-2">
<div class="text-xs text-slate-500">
${match.timestamp}
</div>
<button
onclick="deleteMatch(${index})"
class="px-2 py-1 rounded-lg bg-red-500/10 text-red-400 text-xs hover:bg-red-500/20 transition">
Delete
</button>
</div>
<div class="font-semibold">
${match.team1Name} <span class="text-blue-400">${match.sets1}</span> : <span class="text-blue-400">${match.sets2}</span> ${match.team2Name}
</div>
<div class="text-xs text-slate-400 mt-2">${match.setHistory.join(" | ")}</div>
</div>
`;
                });
            }
        </script>
    </body>
</html>
