<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACSII TT Tournament 🏓</title>
    <!-- Tailwind CSS for modern responsive layout -->
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

    <!-- Header Section -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Custom Modern TT Paddle & Ball Logo -->
                <div class="bg-gradient-to-tr from-amber-500 to-rose-500 p-2.5 rounded-xl text-slate-950 shadow-lg shadow-orange-500/20 flex items-center justify-center">
                    <svg class="w-6 h-6 text-slate-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a7 7 0 1 0 0 14 7 7 0 0 0 0-14z" fill="currentColor" fill-opacity="0.15"/>
                        <path d="M12 16v6"/>
                        <path d="M10 22h4"/>
                        <circle cx="18" cy="6" r="2" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
                        <path d="M15 9c.5-.5 1.5-.5 2 0" stroke-width="1.5"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-1.5">
                        ACSII TT Tournament <span class="text-base">🏓</span>
                    </h1>
                    <p class="text-xs font-semibold tracking-wide bg-gradient-to-r from-amber-400 to-orange-400 bg-clip-text text-transparent">Serve. Smash. Shine</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="resetTournamentData()" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-rose-950/40 hover:text-rose-400 border border-slate-700 hover:border-rose-900/60 rounded-lg transition-all duration-200 flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"></path>
                    </svg>
                    <span>Reset Data</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Category Filter Bar Navigation -->
    <nav class="bg-slate-900 border-b border-slate-800 py-3 sticky top-16 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center space-x-2 overflow-x-auto pb-1 sm:pb-0">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mr-2 hidden sm:inline">Category:</span>
                <button onclick="switchCategory('mens_singles')" id="btn-mens_singles" class="px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap transition-all duration-150 bg-amber-500 text-slate-950 shadow-md">Mens Singles</button>
                <button onclick="switchCategory('mens_doubles')" id="btn-mens_doubles" class="px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap transition-all duration-150 bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white">Mens Doubles</button>
                <button onclick="switchCategory('womens_singles')" id="btn-womens_singles" class="px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap transition-all duration-150 bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white">Womens Singles</button>
                <button onclick="switchCategory('womens_doubles')" id="btn-womens_doubles" class="px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap transition-all duration-150 bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white">Womens Doubles</button>
                <button onclick="switchCategory('mix_doubles')" id="btn-mix_doubles" class="px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap transition-all duration-150 bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white">Mix Doubles</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- LEFT COLUMN: Live Match Scoring & Add Team -->
            <div class="space-y-6 lg:col-span-1">
                
                <!-- Active Scoring Terminal Card -->
                <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 transform translate-x-4 -translate-y-4 opacity-5 pointer-events-none">
                        <svg class="w-40 h-40 text-amber-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10 10 10 0 0 0 10-10A10 10 0 0 0 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                    </div>
                    
                    <div class="flex items-center justify-between mb-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                            <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                            Live Scoring Panel
                        </span>
                        <span id="match-rules-badge" class="text-[11px] text-slate-500">Best of 5 sets (11 pts)</span>
                    </div>

                    <!-- Live Scoring Workspace -->
                    <div id="live-scoring-workspace" class="space-y-5">
                        <div class="grid grid-cols-2 gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-800/80">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-400 mb-1">Player/Team 1</label>
                                <select id="live-team-1" onchange="updateLiveMatchSetup()" class="w-full text-sm bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-500 text-white"></select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-400 mb-1">Player/Team 2</label>
                                <select id="live-team-2" onchange="updateLiveMatchSetup()" class="w-full text-sm bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-500 text-white"></select>
                            </div>
                        </div>

                        <!-- Main Scoreboard Numbers -->
                        <div class="grid grid-cols-2 gap-4 text-center py-2 relative">
                            <div class="absolute left-1/2 top-0 bottom-0 w-px bg-slate-800/60 transform -translate-x-1/2"></div>
                            
                            <!-- Team 1 Controls -->
                            <div class="space-y-3 flex flex-col items-center">
                                <span id="display-name-1" class="text-sm font-semibold truncate max-w-[130px] text-slate-300">Team 1</span>
                                <div class="text-5xl font-black font-mono tracking-tight text-white my-1" id="live-points-1">0</div>
                                <div class="flex space-x-1.5">
                                    <button onclick="adjustPoints(1, -1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm flex items-center justify-center transition">-</button>
                                    <button onclick="adjustPoints(1, 1)" class="w-12 h-8 rounded-lg bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold text-lg flex items-center justify-center transition shadow-md shadow-amber-500/10">+</button>
                                </div>
                                <div class="pt-1">
                                    <span class="text-xs text-slate-500">Sets Won:</span>
                                    <span id="live-sets-1" class="text-xs font-bold text-amber-400 font-mono ml-1">0</span>
                                </div>
                            </div>

                            <!-- Team 2 Controls -->
                            <div class="space-y-3 flex flex-col items-center">
                                <span id="display-name-2" class="text-sm font-semibold truncate max-w-[130px] text-slate-300">Team 2</span>
                                <div class="text-5xl font-black font-mono tracking-tight text-white my-1" id="live-points-2">0</div>
                                <div class="flex space-x-1.5">
