<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACSII TT Tournament 2026 - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Plus Jakarta Sans", sans-serif; }
        .score-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            transition: box-shadow 0.3s;
        }
        .score-glow:focus {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <!-- TOKEN WARNING -->
    <div id="token-warning" class="hidden fixed top-0 left-0 right-0 bg-red-900/80 border-b border-red-700 p-4 text-center z-50">
        <div class="text-red-200">⚠️ <strong>Token Required:</strong> Use URL: <code class="bg-black/30 px-2 py-1 rounded">?token=ghp_your_token</code></div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- HEADER -->
        <div class="mb-8">
            <h1 class="text-4xl font-black text-white mb-2">🏓 ACSII TT Tournament 2026</h1>
            <p class="text-slate-400">Admin Control Panel - Live Scoring</p>
        </div>

        <!-- CATEGORY BUTTONS -->
        <div class="flex flex-wrap gap-2 mb-8">
            <button id="btn-mens_singles" class="px-4 py-2 rounded-lg bg-blue-500 text-white font-semibold category-btn" onclick="switchCategory('mens_singles')">Men's Singles</button>
            <button id="btn-mens_doubles" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 font-semibold category-btn" onclick="switchCategory('mens_doubles')">Men's Doubles</button>
            <button id="btn-womens_singles" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 font-semibold category-btn" onclick="switchCategory('womens_singles')">Women's Singles</button>
            <button id="btn-womens_doubles" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 font-semibold category-btn" onclick="switchCategory('womens_doubles')">Women's Doubles</button>
            <button id="btn-mix_doubles" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 font-semibold category-btn" onclick="switchCategory('mix_doubles')">Mixed Doubles</button>
        </div>

        <!-- LIVE SCORE SECTION -->
        <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl mb-8">
            <div class="text-center mb-8">
                <div class="text-blue-400 font-bold text-sm">LIVE MATCH SCORING</div>
                <div class="text-slate-500 text-xs" id="match-format-display">Best Of 3 Sets</div>
            </div>

            <!-- TEAM SELECTION -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div>
                    <label class="text-sm text-slate-400 mb-2 block">Team 1</label>
                    <select id="live-team-1" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                        <option value="">Select Team 1</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-slate-400 mb-2 block">Team 2</label>
                    <select id="live-team-2" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                        <option value="">Select Team 2</option>
                    </select>
                </div>
            </div>

            <!-- MATCH FORMAT -->
            <div class="mb-8">
                <label class="text-sm text-slate-400 mb-2 block">Match Format</label>
                <select id="match-format-select" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white" onchange="setMatchFormat(this.value)">
                    <option value="3">Best of 3</option>
                    <option value="5">Best of 5</option>
                    <option value="7">Best of 7</option>
                </select>
            </div>

            <!-- SCOREBOARD -->
            <div class="grid grid-cols-2 gap-4 text-center">
                <div>
                    <div id="display-name-1" class="text-lg font-bold mb-4">Team 1</div>
                    <input type="number" id="live-points-1" min="0" value="0" class="score-glow text-5xl font-black w-full text-center bg-slate-900 border-2 border-slate-700 rounded-xl p-2 mb-4"/>
                    <div class="text-sm text-slate-500 mb-2">Points</div>
                    <div class="flex justify-center gap-2 mb-4">
                        <button onclick="adjustPoints(1, -1)" class="w-12 h-12 rounded-lg bg-slate-800 text-xl">-</button>
                        <button onclick="adjustPoints(1, 1)" class="w-16 h-12 rounded-lg bg-blue-500 text-white text-2xl font-bold">+</button>
                    </div>
                    <div class="text-sm text-slate-500">Sets Won</div>
                    <div id="live-sets-1" class="text-2xl font-bold text-blue-400">0</div>
                </div>

                <div>
                    <div id="display-name-2" class="text-lg font-bold mb-4">Team 2</div>
                    <input type="number" id="live-points-2" min="0" value="0" class="score-glow text-5xl font-black w-full text-center bg-slate-900 border-2 border-slate-700 rounded-xl p-2 mb-4"/>
                    <div class="text-sm text-slate-500 mb-2">Points</div>
                    <div class="flex justify-center gap-2 mb-4">
                        <button onclick="adjustPoints(2, -1)" class="w-12 h-12 rounded-lg bg-slate-800 text-xl">-</button>
                        <button onclick="adjustPoints(2, 1)" class="w-16 h-12 rounded-lg bg-blue-500 text-white text-2xl font-bold">+</button>
                    </div>
                    <div class="text-sm text-slate-500">Sets Won</div>
                    <div id="live-sets-2" class="text-2xl font-bold text-blue-400">0</div>
                </div>
            </div>

            <!-- SET HISTORY -->
            <div id="set-history-log" class="mt-8 p-4 rounded-xl bg-slate-950 border border-slate-800 text-center text-slate-300">
                No Sets Completed Yet
            </div>
        </div>

        <!-- STATUS -->
        <div id="status" class="text-center text-slate-500 text-sm">Loading tournament data...</div>
    </main>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const HARDCODED_GIST_ID = "07976ee644e8d7bd84da31758de0ad74";
        let githubToken = new URLSearchParams(window.location.search).get("token");
        let gistId = HARDCODED_GIST_ID;

        // ============================================
        // STATE
        // ============================================
        let tournamentState = {};
        let liveScore = {};
        let currentCategory = "mens_singles";
        let dataFullyLoaded = false;

        // ============================================
        // GITHUB API
        // ============================================
        async function loadFromGitHub() {
            if (!githubToken || !gistId) {
                console.warn("❌ Token or Gist ID missing");
                return null;
            }

            try {
                console.log("📥 Loading from Gist...");
                const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                    headers: { "Authorization": `token ${githubToken}` }
                });

                if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);

                const gist = await response.json();
                console.log("📦 Files available:", Object.keys(gist.files));

                // Load metadata
                const metadataContent = gist.files["tournament-metadata.json"]?.content;
                const metadata = metadataContent ? JSON.parse(metadataContent) : null;

                // Load live data
                const liveContent = gist.files["live-data.json"]?.content;
                const liveData = liveContent ? JSON.parse(liveContent) : null;

                return {
                    tournament: metadata?.tournament || {},
                    liveScore: liveData?.liveScore || {}
                };
            } catch (error) {
                console.error("❌ Error loading:", error);
                return null;
            }
        }

        async function saveToGitHub(liveScoreData) {
            if (!githubToken || !gistId) {
                console.warn("❌ Cannot save - no token");
                return;
            }

            try {
                const gistData = {
                    files: {
                        "live-data.json": {
                            content: JSON.stringify({ liveScore: liveScoreData }, null, 2)
                        }
                    }
                };

                const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                    method: "PATCH",
                    headers: {
                        "Authorization": `token ${githubToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(gistData)
                });

                if (!response.ok) throw new Error(`Save error: ${response.status}`);
                console.log("✅ Saved to GitHub");
            } catch (error) {
                console.error("❌ Save error:", error);
            }
        }

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadTournamentData() {
            const data = await loadFromGitHub();
            if (!data) {
                document.getElementById("status").textContent = "❌ Failed to load data";
                return;
            }

            tournamentState = data.tournament;
            liveScore = data.liveScore || {};

            console.log("✅ Data loaded:", Object.keys(tournamentState));
            initLiveSelectors();
            updateLiveScoreDOM();
            dataFullyLoaded = true;
            document.getElementById("status").textContent = "✅ Ready";
        }

        // ============================================
        // UI UPDATES
        // ============================================
        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll(".category-btn").forEach(btn => btn.classList.remove("bg-blue-500", "text-white"));
            document.getElementById(`btn-${category}`).classList.add("bg-blue-500", "text-white");
            initLiveSelectors();
        }

        function initLiveSelectors() {
            const category = tournamentState[currentCategory];
            if (!category || !category.teams) {
                console.warn("❌ No category or teams found");
                return;
            }

            const select1 = document.getElementById("live-team-1");
            const select2 = document.getElementById("live-team-2");

            select1.innerHTML = '<option value="">Select Team 1</option>';
            select2.innerHTML = '<option value="">Select Team 2</option>';

            category.teams.forEach(team => {
                select1.innerHTML += `<option value="${team.name}">${team.name}</option>`;
                select2.innerHTML += `<option value="${team.name}">${team.name}</option>`;
            });

            // Restore previous selection
            if (liveScore.team1Name) select1.value = liveScore.team1Name;
            if (liveScore.team2Name) select2.value = liveScore.team2Name;

            // Event listeners
            select1.onchange = () => {
                liveScore.team1Name = select1.value;
                updateLiveScore();
                updateLiveScoreDOM();
            };

            select2.onchange = () => {
                liveScore.team2Name = select2.value;
                updateLiveScore();
                updateLiveScoreDOM();
            };
        }

        function setMatchFormat(format) {
            liveScore.matchFormat = parseInt(format);
            const text = `Best Of ${format}`;
            document.getElementById("match-format-display").innerText = text;
            updateLiveScore();
        }

        function adjustPoints(team, amount) {
            if (team === 1) {
                liveScore.team1Points = Math.max(0, (liveScore.team1Points || 0) + amount);
            } else {
                liveScore.team2Points = Math.max(0, (liveScore.team2Points || 0) + amount);
            }
            updateLiveScore();
            updateLiveScoreDOM();
        }

        function updateLiveScoreDOM() {
            document.getElementById("live-points-1").value = liveScore.team1Points || 0;
            document.getElementById("live-points-2").value = liveScore.team2Points || 0;
            document.getElementById("live-sets-1").innerText = liveScore.team1Sets || 0;
            document.getElementById("live-sets-2").innerText = liveScore.team2Sets || 0;
            document.getElementById("display-name-1").innerText = liveScore.team1Name || "Team 1";
            document.getElementById("display-name-2").innerText = liveScore.team2Name || "Team 2";
        }

        function updateLiveScore() {
            if (!dataFullyLoaded) return;

            const updated = {
                isActive: !!liveScore.team1Name && !!liveScore.team2Name,
                category: currentCategory,
                team1Name: liveScore.team1Name || "",
                team2Name: liveScore.team2Name || "",
                team1Points: liveScore.team1Points || 0,
                team2Points: liveScore.team2Points || 0,
                team1Sets: liveScore.team1Sets || 0,
                team2Sets: liveScore.team2Sets || 0,
                setHistory: liveScore.setHistory || [],
                matchFormat: liveScore.matchFormat || 3,
                timestamp: new Date().toISOString()
            };

            liveScore = updated;
            saveToGitHub(updated);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener("DOMContentLoaded", async () => {
            console.log("🚀 Admin page loaded");

            if (!githubToken) {
                document.getElementById("token-warning").classList.remove("hidden");
                document.getElementById("status").textContent = "❌ Token required";
                return;
            }

            await loadTournamentData();
        });
    </script>
</body>
</html>
